services:
  # 🐘 PostgreSQL — Asosiy relyatsion ma'lumotlar bazasi (port 5432)
  postgres:
    image: postgres:18-alpine
    container_name: webtoonhub_postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-webtoonhub}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-webtoonhub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ⚡ Redis — Keshlash va yuqori tezlik (port 6379)
  redis:
    image: redis:8-alpine
    container_name: webtoonhub_redis
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🪣 MinIO — S3 moslashuvchan rasmlar va media ombori (API: 9000, UI: 9001)
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: webtoonhub_minio
    restart: unless-stopped
    network_mode: host
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  # 📬 Mailpit — Lokal SMTP sinov serveri (SMTP: 1025, UI: 8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: webtoonhub_mailpit
    restart: unless-stopped
    network_mode: host

volumes:
  postgres_data:
  redis_data:
  minio_data:
