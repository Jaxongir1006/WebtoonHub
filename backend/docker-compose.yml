version: '3.8'

services:
  # 🐘 PostgreSQL — Asosiy relyatsion ma'lumotlar bazasi
  postgres:
    image: postgres:16-alpine
    container_name: webtoonhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-webtoonhub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-webtoonhub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ⚡ Redis — Keshlash va yuqori tezlik (API < 50ms)
  redis:
    image: redis:7-alpine
    container_name: webtoonhub_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🪣 MinIO — S3 moslashuvchan rasmlar va media ombori
  minio:
    image: minio/minio:latest
    container_name: webtoonhub_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 📬 Mailpit — Lokal SMTP sinov serveri va Web Pochta interfeysi
  mailpit:
    image: axllent/mailpit:latest
    container_name: webtoonhub_mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"   # SMTP server
      - "${MAILPIT_UI_PORT:-8025}:8025" # Web pochta interfeysi

volumes:
  postgres_data:
  redis_data:
  minio_data:
