# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: keyvalue
    name: webtoonhub-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
  - type: web
    name: webtoonhub-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: 'false'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: 'true'
      - key: DATABASE_POOL_SIZE
        value: '2'
      - key: DATABASE_MAX_OVERFLOW
        value: '1'
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: webtoonhub-cache
          property: connectionString
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET_MEDIA
        value: webtoonhub-media
      - key: STORAGE_BUCKET_IMPORTS
        value: webtoonhub-imports
      - key: ALLOWED_ORIGINS
        value: '["https://webtoon-hub-xmfh.vercel.app","https://webtoon-hub-nine.vercel.app"]'
      - key: FRONTEND_URL
        value: https://webtoon-hub-xmfh.vercel.app
